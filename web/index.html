<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AVES Tecnici">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AVES Tecnici</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #1A1A2E;
      overflow: hidden;
    }
  </style>
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>
  <script>
    // AVES push notification helper
    window.avesShowNotification = function(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var opts = {
        body: body,
        icon: '/AVES/icons/Icon-192.png',
        badge: '/AVES/icons/Icon-192.png',
        vibrate: [200, 100, 200]
      };
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function(reg) {
          reg.showNotification(title, opts);
        }).catch(function() {
          try { new Notification(title, opts); } catch(e) {}
        });
      } else {
        try { new Notification(title, opts); } catch(e) {}
      }
    };
    // Tastiera su Android. Flutter sostituisce il meta viewport qui sopra (perde
    // interactive-widget=resizes-content): la tastiera allora sposta la viewport
    // visibile invece di ridimensionare la pagina, l'AppBar esce dall'alto e se
    // Flutter rimpicciolisce la tela sotto resta lo sfondo della pagina (fascia
    // vuota alta quanto la tastiera). Lo rimetto dopo il primo frame.
    window.addEventListener('flutter-first-frame', function() {
      var m = document.querySelector('meta[name=viewport]');
      if (m) m.content += ', interactive-widget=resizes-content';
    });
    // Chrome scorre il body per mostrare il campo sotto la tastiera: al campo ci
    // pensa già Flutter, il body deve restare fermo.
    document.addEventListener('scroll', function(e) {
      if (e.target === document.body) document.body.scrollTop = 0;
    }, true);
    // Flutter aggiorna l'altezza solo ai resize fuori dall'editing: se la
    // tastiera si chiude con un campo ancora attivo la vista resta bassa (fascia
    // vuota sotto). Chiusa la tastiera tolgo il focus, e a editing finito un
    // resize sintetico (isTrusted false, ignorato qui) gli fa rileggere la viewport.
    var vv = window.visualViewport;
    if (vv && matchMedia('(pointer: coarse)').matches) {
      var full = vv.height, w = vv.width;
      vv.addEventListener('resize', function(e) {
        if (!e.isTrusted) return;
        if (vv.width !== w) { w = vv.width; full = 0; }
        if (vv.height < full) return;
        full = vv.height;
        var a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) a.blur();
      });
    }
    document.addEventListener('focusout', function() {
      setTimeout(function() {
        if (vv) vv.dispatchEvent(new Event('resize'));
      }, 300);
    });
    // Nuova versione deployata: il service worker si aggiorna in background,
    // ricarica una volta sola così non resta in uso la build vecchia dalla cache.
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
